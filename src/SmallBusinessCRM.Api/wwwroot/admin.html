<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/admin">CRM Administration</a><a class="btn btn-sm btn-outline-light" href="/manager">Pipeline</a></div></nav><main class="container py-4"><div class="row g-4"><section class="col-lg-5"><div class="card"><div class="card-body"><h1 class="h4">Bulk lead import</h1><p class="small text-muted">CSV headers: Title, CompanyName, ContactName, Email, Phone, Value, Status.</p><input id="csv" class="form-control mb-2" type="file" accept=".csv"><button id="import" class="btn btn-primary">Import CSV</button><p id="importResult" class="small mt-2"></p><a class="btn btn-outline-success btn-sm" href="/api/data/leads/export">Export leads CSV</a> <a class="btn btn-outline-success btn-sm" href="/api/data/activities/export">Export activities</a></div></div></section><section class="col-lg-7"><div class="card"><div class="card-body"><h2 class="h4">Create user</h2><form id="userForm" class="row g-2"><div class="col-md-6"><input class="form-control" name="fullName" placeholder="Full name" required></div><div class="col-md-6"><input class="form-control" type="email" name="email" placeholder="Email" required></div><div class="col-md-6"><input class="form-control" type="password" name="password" placeholder="Temporary password" required></div><div class="col-md-4"><select class="form-select" name="role"><option>SalesRepresentative</option><option>Manager</option><option>Admin</option></select></div><div class="col-md-2"><button class="btn btn-dark w-100">Create</button></div></form><p id="userResult" class="small mt-2"></p></div></div></section><section class="col-12"><div class="card"><div class="card-body"><h2 class="h4">Deleted leads</h2><div id="trash" class="small text-muted">Loading…</div></div></div></section><section class="col-12"><div class="card"><div class="card-body"><h2 class="h4">Audit log</h2><div class="table-responsive"><table class="table table-sm"><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Record</th></tr></thead><tbody id="audit"></tbody></table></div></div></div></section></div></main><script src="js/api.js"></script><script src="js/admin.js"></script></body></html>
