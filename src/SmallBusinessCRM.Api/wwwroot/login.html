<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | Small Business CRM</title>
    <!-- Prevent Theme Flash -->
    <script>
        (function() {
            const saved = localStorage.getItem('crm_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <link href="css/site.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans transition-colors duration-200">
    <!-- Theme Switcher Top-Right -->
    <div class="fixed top-4 right-4 z-50">
        <button id="themeToggle" type="button" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 shadow-sm focus:outline-none transition-colors" aria-label="Toggle theme">
            <!-- Icon injected by api.js -->
        </button>
    </div>

    <!-- Login Card -->
    <main class="w-full max-w-md glass-panel p-8 shadow-xl border border-slate-200/80 dark:border-slate-800/80 relative">
        <div class="text-center mb-8">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 items-center justify-center text-white shadow-lg shadow-brand-500/30 mb-3">
                <i class="fa-solid fa-chart-line text-2xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">ApexCRM</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Sign in to your portfolio workspace</p>
        </div>

        <!-- Session Alert -->
        <div id="sessionAlert" class="hidden mb-6 p-3 rounded-xl bg-amber-50 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-800 text-amber-800 dark:text-amber-200 text-xs flex items-center space-x-2" role="alert">
            <i class="fa-solid fa-circle-exclamation text-amber-500 flex-shrink-0"></i>
            <span>Your session has expired. Please sign in again.</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" method="post" action="/account/login" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Email address</label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input id="email" name="Email" type="email" required autocomplete="email" autofocus class="w-full pl-9 pr-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all" placeholder="user@crm.local">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input id="password" name="Password" type="password" required autocomplete="current-password" class="w-full pl-9 pr-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all" placeholder="••••••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs">
                <label class="flex items-center space-x-2 cursor-pointer select-none">
                    <input name="RememberMe" type="checkbox" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 border-slate-300 dark:border-slate-700 dark:bg-slate-800">
                    <span class="text-slate-600 dark:text-slate-400 font-medium">Remember this browser</span>
                </label>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-2.5 px-4 text-xs font-bold rounded-xl text-white bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 shadow-md shadow-brand-500/25 focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all flex items-center justify-center space-x-2">
                <span>Sign in to CRM</span>
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </button>
        </form>

        <!-- Demo Credentials -->
        <div class="mt-6 pt-5 border-t border-slate-200/80 dark:border-slate-800/80 text-[11px] text-slate-500 dark:text-slate-400 space-y-1">
            <div class="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider text-[10px] mb-1.5 flex items-center">
                <i class="fa-solid fa-key text-brand-500 mr-1.5"></i>Demo Credentials:
            </div>
            <div class="flex items-center justify-between bg-slate-100/70 dark:bg-slate-900/60 p-2 rounded-lg font-mono">
                <span>team@paruluniversity.ac.in</span>
                <span class="text-slate-400">Atul6001@</span>
            </div>
            <div class="flex items-center justify-between bg-slate-100/70 dark:bg-slate-900/60 p-2 rounded-lg font-mono">
                <span>atul@crm.local</span>
                <span class="text-slate-400">ChangeMe123!</span>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        // Check for session expired query param
        const params = new URLSearchParams(window.location.search);
        if (params.get('expired') === 'true') {
            document.getElementById('sessionAlert')?.classList.remove('hidden');
        }

        // Intercept form to also request JWT Token for seamless SPA/SignalR client storage
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', async (e) => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const tokenRes = await fetch('/account/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (tokenRes.ok) {
                    const tokenData = await tokenRes.json();
                    setAuthSession(tokenData.token, {
                        email: tokenData.email,
                        fullName: tokenData.fullName,
                        roles: tokenData.roles
                    });
                }
            } catch (err) {
                console.warn('Could not preemptively store JWT token:', err);
            }
        });
    </script>
</body>
</html>
