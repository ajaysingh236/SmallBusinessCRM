<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRM Sign in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <main class="card shadow-sm p-4 mx-auto" style="width: 24rem">
        <h1 class="h3 mb-1">Small Business CRM</h1>
        <p class="text-muted">Sign in to your workspace</p>

        <div id="sessionAlert" class="alert alert-warning py-2 small d-none" role="alert">
            Your session has expired. Please sign in again.
        </div>

        <form method="post" action="/account/login">
            <label class="form-label" for="email">Email</label>
            <input id="email" class="form-control mb-3" name="Email" type="email" required autofocus autocomplete="email">

            <label class="form-label" for="password">Password</label>
            <input id="password" class="form-control mb-3" name="Password" type="password" required autocomplete="current-password">

            <label class="form-check mb-3">
                <input class="form-check-input" name="RememberMe" type="checkbox">
                <span class="form-check-label">Remember me</span>
            </label>

            <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>

        <p class="small text-muted mt-3 mb-0">Development: team@paruluniversity.ac.in / Atul6001@</p>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('expired') === 'true') {
            document.getElementById('sessionAlert')?.classList.remove('d-none');
        }
    </script>
</body>
</html>
