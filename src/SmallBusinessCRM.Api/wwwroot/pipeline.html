<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sales Pipeline | Small Business CRM</title>
    <!-- Prevent Theme Flash -->
    <script>
        (function() {
            const saved = localStorage.getItem('crm_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <link href="css/site.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">
    <!-- Glassmorphic Header Navigation -->
    <header class="sticky top-0 z-40 glass-nav border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <a href="/index.html" class="flex items-center space-x-3 group">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
                            <i class="fa-solid fa-chart-line text-lg"></i>
                        </div>
                        <div>
                            <span class="text-base font-bold tracking-tight text-slate-900 dark:text-white">ApexCRM</span>
                            <span class="hidden sm:inline-block ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-brand-100 text-brand-700 dark:bg-brand-900/50 dark:text-brand-300">Enterprise</span>
                        </div>
                    </a>
                    <nav class="hidden md:flex ml-8 space-x-1" aria-label="Main Navigation">
                        <a href="/index.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
                            <i class="fa-solid fa-gauge-high mr-2 text-slate-400"></i>Dashboard
                        </a>
                        <a href="/pipeline.html" class="px-3 py-2 rounded-lg text-sm font-semibold text-brand-600 dark:text-brand-400 bg-brand-50 dark:bg-brand-950/60 transition-colors" aria-current="page">
                            <i class="fa-solid fa-table-columns mr-2"></i>Pipeline
                        </a>
                        <a href="/admin.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
                            <i class="fa-solid fa-sliders mr-2 text-slate-400"></i>Admin
                        </a>
                    </nav>
                </div>

                <div class="flex items-center space-x-3">
                    <!-- Realtime Indicator -->
                    <div id="realtimeStatus" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 pulse-green"></span>
                        <span id="realtimeStatusText">Live Sync</span>
                    </div>

                    <!-- Dark Mode Toggle Button -->
                    <button id="themeToggle" type="button" class="p-2 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none transition-colors" aria-label="Toggle theme">
                        <!-- Icon injected by api.js -->
                    </button>

                    <!-- User / Logout -->
                    <button id="logoutBtn" type="button" class="inline-flex items-center px-3 py-1.5 border border-slate-200 dark:border-slate-700 text-xs font-medium rounded-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none transition-colors">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-1.5 text-slate-400"></i>Sign out
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Sub-header & Controls -->
    <section class="bg-white/60 dark:bg-slate-900/60 border-b border-slate-200/80 dark:border-slate-800/80 py-4 px-4 sm:px-6 lg:px-8 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    <span>Deals Pipeline</span>
                    <span id="totalDealsCount" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">0 deals</span>
                </h1>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Drag cards across stages. Changes synchronize in real-time across all connected clients.</p>
            </div>
            <div class="flex items-center flex-wrap gap-2.5">
                <div class="relative min-w-[200px] sm:min-w-[240px]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input id="searchInput" type="search" placeholder="Filter company, contact..." class="w-full pl-9 pr-3 py-1.5 text-xs bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="px-3 py-1.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 text-xs font-semibold flex items-center gap-1.5 border border-indigo-200/60 dark:border-indigo-800/60">
                    <span class="text-indigo-500 font-normal">Pipeline Value:</span>
                    <span id="totalPipelineSum" class="font-bold">₹0</span>
                </div>
                <button id="refreshBtn" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-xs font-medium border border-slate-200 dark:border-slate-700 transition-colors" title="Reload pipeline">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </div>
    </section>

    <!-- Main Kanban Workspace -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-[1700px] w-full mx-auto overflow-hidden flex flex-col">
        <div id="kanbanBoard" class="kanban-board flex-1">
            <!-- Columns dynamically injected via pipeline.js -->
        </div>
    </main>

    <!-- Keyboard Move Modal -->
    <div id="moveModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="moveModalTitle">
        <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
            <h3 id="moveModalTitle" class="text-lg font-bold text-slate-900 dark:text-white mb-2">Change Deal Stage</h3>
            <p id="moveModalLeadName" class="text-xs text-slate-500 dark:text-slate-400 mb-4"></p>
            <div class="space-y-2 mb-5" id="stageSelectList">
                <!-- Generated stage buttons -->
            </div>
            <div class="flex justify-end">
                <button type="button" id="closeMoveModal" class="px-4 py-2 text-xs font-medium rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pipeline.js"></script>
</body>
</html>
