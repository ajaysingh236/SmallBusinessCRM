version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crm-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-StrongP@ssw0rd2026!}"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: crm-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      DatabaseProvider: "SqlServer"
      ConnectionStrings__CrmDatabase: "Server=db,1433;Database=SmallBusinessCrmDb;User Id=sa;Password=${DB_PASSWORD:-StrongP@ssw0rd2026!};TrustServerCertificate=True;"
      Redis__Configuration: "redis:6379"
      Redis__InstanceName: "SmallBusinessCRM:"
      Seq__ServerUrl: "http://seq:5341"
      Jwt__Key: "${JWT_SIGNING_KEY:-SmallBusinessCRM_Super_Secret_Key_For_Jwt_Auth_2026_Prod!}"
      Jwt__Issuer: "SmallBusinessCRM"
      Jwt__Audience: "SmallBusinessCRM"
    ports:
      - "5000:5000"
    volumes:
      - crm_api_data:/app/data

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: crm-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  mssql_data:
  redis_data:
  seq_data:
  crm_api_data:
